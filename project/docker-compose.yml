services:

  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
      - ./documents:/app/documents
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama: