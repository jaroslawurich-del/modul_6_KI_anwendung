version: "3.9"

services:

  app:
    build: .
    container_name: ki_assistant_app
    ports:
      - "8501:8501"

    volumes:
      - .:/app
      - chroma_data:/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs

    env_file:
      - .env

    environment:
      - VECTOR_DB_DIR=/data/chroma_db

    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
  chroma_data: